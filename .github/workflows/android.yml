name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          mkdir -p android/keystore
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/keystore/boilerreport.jks
          else
            echo "::warning::Falta el secreto ANDROID_KEYSTORE: se usa una clave temporal (para actualizar habrá que desinstalar)."
            keytool -genkeypair -keystore android/keystore/boilerreport.jks -storepass boilerreport -keypass boilerreport -alias boilerreport -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BoilerReport, O=IQS, C=CL"
          fi

      - name: Copiar la app web dentro del APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html jszip.min.js manifest.json icon-192.png icon-512.png pdfjs android/app/src/main/assets/www/

      - name: Compilar
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BoilerReport.apk

      - uses: actions/upload-artifact@v7
        with:
          name: BoilerReport
          path: BoilerReport.apk

      - name: Publicar APK para descargar desde el teléfono
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk BoilerReport.apk --title "BoilerReport (Android)" --notes "Última versión compilada automáticamente. Descarga BoilerReport.apk desde el teléfono e instálalo." --latest
